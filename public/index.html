<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32.png" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Weper" />
    <meta property="og:title" content="Weper" />
    <meta property="og:description" content="Weper: gestão inteligente para negócios que atendem, vendem e querem crescer. Do pedido ao resultado, no mobile, tablet e desktop." />
    <meta property="og:url" content="https://www.weper.com.br/" />
    <meta property="og:image" content="https://www.weper.com.br/og-image.png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2563EB" />
    <meta
      name="description"
      content="Weper: gestão inteligente para negócios que atendem, vendem e querem crescer. Do pedido ao resultado, no mobile, tablet e desktop."
    />
    <style>
      html, body { background-color: #F8FAFC; color: #0F172A; color-scheme: light; font-family: Inter, sans-serif; }
      html[data-theme="dark"], html[data-theme="dark"] body { background-color: #0B1220; color: #F8FAFC; color-scheme: dark; }
    </style>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('weper-theme');
          var theme = (stored === 'light' || stored === 'dark') ? stored : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#0B1220' : '#2563EB');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
          document.documentElement.style.colorScheme = 'light';
        }
      })();
    </script>
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>Weper</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    -->
  </body>
</html>
